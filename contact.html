  <main class="content">
    <section class="page-section contact-page">
      <div class="eyebrow">CONNECT · COLLABORATE · SAY HELLO</div>
      <h1>Get in touch</h1>
      <p class="page-intro">Want to talk networking, wireless, infrastructure, security, or homelabs? Send me a message.</p>

      <form class="contact-form" id="contact-form" action="#" method="post">
        <div class="form-row">
          <div class="form-field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
        </div>

        <div class="form-field">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" required>
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="8" required></textarea>
        </div>

        <div class="form-honeypot" aria-hidden="true">
          <label for="company">Leave this field empty</label>
          <input id="company" name="company" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button class="button primary form-submit" type="submit">Send message</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>

      <p class="contact-alternative">You can also reach me through <a href="https://www.linkedin.com/in/joeinit" target="_blank" rel="noopener noreferrer">LinkedIn</a>.</p>
    </section>
  </main>
  <script src="./script.js"></script>
